  <text x="540" y="418" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="17" font-weight="bold" fill="#204a78">同一物点 A → 两种不同方向 → 傅里叶面不同位置 → 像面汇聚在同一 A′</text>
  <text x="540" y="443" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" fill="#204a78">不同物点 A、B → 相同原始方向 → 傅里叶面同一 ξ₊ → 像面不同位置</text>
