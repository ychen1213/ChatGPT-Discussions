<text x="585" y="397" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="22" fill="#203c58" font-weight="bold">像面：I(X,Y) = | IFFT[B(k)] |²</text>
<text x="585" y="422" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" fill="#61748e">空间反转不自动取复共轭；强度交叉项计算才出现复共轭</text>
</svg>